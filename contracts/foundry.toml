[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
fs_permissions = [{ access = "read", path = "../packages/core/test/fixtures" }]

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://arc-testnet.drpc.org"
